[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-podcast-downloader"
version = "0.0.1"
description = "CLI tool to archive Apple-hosted (HLS/Widevine) podcasts and exclusive episodes"
requires-python = ">=3.10"
dependencies = [
    "pywidevine>=1.9.0",
    "requests",
    "python-dotenv",
    "mutagen",
    "platformdirs",
    "pywinpty; sys_platform == 'win32'",
]

[project.scripts]
apple-podcast = "apple_podcast_downloader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
